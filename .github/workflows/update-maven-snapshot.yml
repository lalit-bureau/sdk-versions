# Hourly snapshot of Android SDK versions from packages.bureau.id.
#
# Browsers cannot read that server directly (no CORS headers), so index.html
# falls back to the versions-android.json this workflow commits. Commits happen
# only when a version actually changes, plus a keep-alive refresh so GitHub does
# not disable the schedule after 60 days without repository activity.
#
# To track another artifact, add its maven path to the ARTIFACTS line.

name: Update Android versions snapshot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-maven-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest versions from Bureau Maven
        run: |
          set -euo pipefail
          BASE="https://packages.bureau.id/api/packages/Bureau/maven"
          # Each job is "<maven-path>|<snapshot-key>|<selector>". One artifact can
          # produce several keys (device-intelligence ships two parallel lines).
          #   latest  = the <latest>/<release> tag as published
          #   highest = the highest stable X.Y.Z version
          #   v1      = the newest version on the 1.x line (pre-releases included)
          entries='{}'
          while IFS='|' read -r path key mode; do
            [ -z "$path" ] && continue
            xml=$(curl -fsS --max-time 60 "$BASE/$path/maven-metadata.xml")
            vers=$(echo "$xml" | grep -oE '<version>[^<]+</version>' | sed -E 's|</?version>||g')
            case "$mode" in
              latest)
                v=$(echo "$xml" | grep -oE '<latest>[^<]+</latest>' | sed -E 's|</?latest>||g' || true)
                [ -z "$v" ] && v=$(echo "$xml" | grep -oE '<release>[^<]+</release>' | sed -E 's|</?release>||g' || true)
                ;;
              highest)
                v=$(echo "$vers" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
                ;;
              v1)
                v=$(echo "$vers" | grep -E '^1\.' | sort -V | tail -1 || true)
                ;;
            esac
            [ -z "$v" ] && { echo "no version resolved for $path ($mode)"; exit 1; }
            name=$(basename "$path")
            lm=$(curl -fsSI --max-time 60 "$BASE/$path/$v/$name-$v.pom" | grep -i '^last-modified:' | sed -E 's/^[Ll]ast-[Mm]odified:[[:space:]]*//' | tr -d '\r' || true)
            entries=$(echo "$entries" | jq --arg k "$key" --arg v "$v" --arg d "$lm" '. + {($k): {version: $v, date: $d}}')
          done < <(printf '%s\n' \
            "id/bureau/otl|id/bureau/otl|latest" \
            "id/bureau/livenesscheck|id/bureau/livenesscheck|latest" \
            "id/bureau/device-intelligence|id/bureau/device-intelligence|highest" \
            "id/bureau/device-intelligence|id/bureau/device-intelligence@1|v1")
          jq -n --argjson artifacts "$entries" --arg t "$(date -u +%FT%TZ)" \
            '{checked_at: $t, artifacts: $artifacts}' > versions-android.json.new
          cat versions-android.json.new

      - name: Commit if changed
        run: |
          set -euo pipefail
          if [ -f versions-android.json ] \
            && cmp -s <(jq -S .artifacts versions-android.json) <(jq -S .artifacts versions-android.json.new); then
            last=$(git log -1 --format=%ct -- versions-android.json)
            age_days=$(( ( $(date +%s) - last ) / 86400 ))
            if [ "$age_days" -lt 50 ]; then
              echo "No version change (snapshot ${age_days}d old); skipping commit."
              rm versions-android.json.new
              exit 0
            fi
            echo "Keep-alive refresh (snapshot ${age_days}d old)."
          fi
          mv versions-android.json.new versions-android.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions-android.json
          git commit -m "Update Android versions snapshot"
          git push
