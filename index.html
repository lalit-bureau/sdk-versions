/* ---- fetchers: each returns { version, date, url } ---- */

function githubLatestRelease(repo) {
  return async () => {
    const r = await fetch(`https://api.github.com/repos/${repo}/releases/latest`, {
      headers: { Accept: "application/vnd.github+json" },
    });
    if (r.status === 403 || r.status === 429) throw new Error("GitHub API rate limit reached, retry in a few minutes");
    if (!r.ok) throw new Error(`GitHub API ${r.status}`);
    const j = await r.json();
    return {
      version: (j.tag_name || "").replace(/^v/, ""),
      date: j.published_at,
      url: j.html_url,
    };
  };
}

function npmPackage(pkg) {
  return async () => {
    const r = await fetch(`https://registry.npmjs.org/${pkg}`);
    if (!r.ok) throw new Error(`npm registry ${r.status}`);
    const j = await r.json();
    const v = j["dist-tags"] && j["dist-tags"].latest;
    if (!v) throw new Error("no latest dist-tag");
    return {
      version: v,
      date: j.time && j.time[v],
      url: `https://www.npmjs.com/package/${pkg}/v/${v}`,
    };
  };
}

function pubPackage(pkg) {
  return async () => {
    const r = await fetch(`https://pub.dev/api/packages/${pkg}`);
    if (!r.ok) throw new Error(`pub.dev ${r.status}`);
    const j = await r.json();
    const l = j.latest;
    if (!l || !l.version) throw new Error("no latest version");
    return {
      version: l.version,
      date: l.published,
      url: `https://pub.dev/packages/${pkg}/versions/${l.version}`,
      archiveUrl: l.archive_url,
    };
  };
}

function bureauMaven(artifactPath) {
  const metaUrl = `https://packages.bureau.id/api/packages/Bureau/maven/${artifactPath}/maven-metadata.xml`;
  const parts = artifactPath.split("/");
  const artifact = parts.pop();
  const uiUrl = `https://packages.bureau.id/Bureau/-/packages/maven/${parts.join(".")}-${artifact}/versions`;
  return async () => {
    try {
      const r = await fetch(metaUrl);
      if (!r.ok) throw new Error(`maven ${r.status}`);
      const xml = await r.text();
      const m = xml.match(/<latest>([^<]+)<\/latest>/) || xml.match(/<release>([^<]+)<\/release>/);
      if (!m) throw new Error("could not parse maven-metadata.xml");
      const version = m[1];
      let date = null;
      try {
        const pom = await fetch(
          `https://packages.bureau.id/api/packages/Bureau/maven/${artifactPath}/${version}/${artifact}-${version}.pom`,
          { method: "HEAD" }
        );
        date = pom.headers.get("Last-Modified");
      } catch (e) {}
      return { version, date, url: uiUrl };
    } catch (liveError) {
      // Browsers cannot read packages.bureau.id (no CORS headers); fall back to
      // the snapshot a scheduled workflow commits next to this page.
      try {
        const r = await fetch("versions-android.json", { cache: "no-store" });
        if (!r.ok) throw 0;
        const j = await r.json();
        const entry = j.artifacts && j.artifacts[artifactPath];
        if (!entry || !entry.version) throw 0;
        let note = null;
        const checked = j.checked_at ? new Date(j.checked_at).getTime() : NaN;
        const ageHours = (Date.now() - checked) / 3600000;
        if (isFinite(ageHours) && ageHours > 6) {
          note = `last verified ${Math.round(ageHours)} hours ago`;
          track("snapshot_stale", { artifact: artifactPath, age_hours: Math.round(ageHours) });
        }
        return { version: entry.version, date: entry.date || null, url: uiUrl, note };
      } catch (e) {
        throw new Error("cannot be read from the browser; use the Source link below to view versions");
      }
    }
  };
}

function semverCompare(a, b) {
  const pa = String(a).split(/[.\-+]/);
  const pb = String(b).split(/[.\-+]/);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const na = parseInt(pa[i], 10);
    const nb = parseInt(pb[i], 10);
    const va = isNaN(na) ? -1 : na;
    const vb = isNaN(nb) ? -1 : nb;
    if (va !== vb) return va - vb;
  }
  return 0;
}

async function fetchPodVersion(pod) {
  // The CocoaPods CDN allows CORS; pods are indexed in shard files named
  // by the first three hex chars of md5(pod name).
  const r = await fetch(`https://cdn.cocoapods.org/all_pods_versions_${pod.shard}.txt`);
  if (!r.ok) throw new Error(`CocoaPods CDN ${r.status}`);
  const text = await r.text();
  const line = text.split("\n").find((l) => l.startsWith(pod.name + "/"));
  if (!line) throw new Error(`pod '${pod.name}' not found in CDN index`);
  const versions = line.trim().split("/").slice(1);
  if (!versions.length) throw new Error(`no versions listed for pod '${pod.name}'`);
  return versions.sort(semverCompare).pop();
}

async function fetchPins(pkg, version, pins) {
  const base = `https://cdn.jsdelivr.net/npm/${pkg}@${version}`;
  return Promise.all(
    pins.map(async (p) => {
      const r = await fetch(`${base}/${p.file}`).catch(() => null);
      const text = r && r.ok ? await r.text() : "";
      return { ...p, version: (text.match(p.regex) || [])[1] || null };
    })
  );
}

// Minimal tar reader: returns a { path: text } map of regular file entries.
function parseTar(buf) {
  const files = {};
  const dec = new TextDecoder();
  let off = 0;
  while (off + 512 <= buf.length) {
    const name = dec.decode(buf.subarray(off, off + 100)).replace(/\0.*$/, "");
    if (!name) break; // zero block marks end of archive
    const sizeStr = dec.decode(buf.subarray(off + 124, off + 136)).replace(/\0.*$/, "").trim();
    const size = parseInt(sizeStr, 8) || 0;
    const typeflag = String.fromCharCode(buf[off + 156]);
    const dataStart = off + 512;
    if (typeflag === "0" || typeflag === "\0" || typeflag === "") {
      files[name.replace(/^\.\//, "")] = dec.decode(buf.subarray(dataStart, dataStart + size));
    }
    off = dataStart + Math.ceil(size / 512) * 512;
  }
  return files;
}

// Read native pins from a Dart/Flutter package archive on pub.dev. The gzipped
// tarball is decompressed in the browser, then the pinned files are matched.
async function fetchPubPins(archiveUrl, pins) {
  let files = {};
  try {
    if (!archiveUrl) throw new Error("no archive url");
    const r = await fetch(archiveUrl);
    if (!r.ok) throw new Error(`pub archive ${r.status}`);
    const stream = r.body.pipeThrough(new DecompressionStream("gzip"));
    const buf = new Uint8Array(await new Response(stream).arrayBuffer());
    files = parseTar(buf);
  } catch (e) {
    // leave files empty; every pin resolves to its missing state
  }
  return pins.map((p) => {
    const text = files[p.file] || "";
    return { ...p, version: (text.match(p.regex) || [])[1] || null };
  });
}

const ICON_CHECK =
  '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 6.5 12 13 4.5"/></svg>';

function copyBtn(text) {
  return `<button class="copy" data-copy="${esc(text)}" title="Copy ${esc(text)}" aria-label="Copy ${esc(text)}">${ICON_COPY}</button>`;
}

function sectionCopyText(sec) {
  const lines = sec.sdks.map((s) => {
    const res = results[s.id] || {};
    let line = `${s.platform} (${s.name}): ${res.version || "unavailable"}`;
    if (res.pod) line += ` [CocoaPods ${res.pod}]`;
    if (res.pins) {
      const pins = res.pins.filter((p) => p.version).map((p) => `${p.label} ${p.version}`).join(", ");
      if (pins) line += ` [bundles ${pins}]`;
    }
    return line;
  });
  return [sec.title, ...lines].join("\n");
}

document.addEventListener("click", (ev) => {
  const btn = ev.target.closest("button.copy");
  if (!btn) return;
  const text =
    btn.dataset.section !== undefined ? sectionCopyText(SECTIONS[+btn.dataset.section]) : btn.dataset.copy;
  if (btn.dataset.section !== undefined) {
    track("copy_section", { section: SECTIONS[+btn.dataset.section].title });
  } else {
    const card = btn.closest(".card");
    track("copy_version", { sdk: card ? card.id.replace("card-", "") : "unknown", value: text });
  }
  const write = navigator.clipboard
    ? navigator.clipboard.writeText(text)
    : Promise.reject();
  write.catch(() => {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  });
  btn.classList.add("copied");
  btn.innerHTML = ICON_CHECK;
  setTimeout(() => {
    btn.classList.remove("copied");
    btn.innerHTML = ICON_COPY;
  }, 1200);
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function daysAgo(iso) {
  if (!iso) return null;
  const then = new Date(iso);
  if (isNaN(then)) return null;
  const now = new Date();
  // Compare calendar dates in local time so the label flips at midnight,
  // not 24 hours after the release moment.
  const startThen = new Date(then.getFullYear(), then.getMonth(), then.getDate());
  const startNow = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.round((startNow - startThen) / 86400000);
  if (days <= 0) return "today";
  if (days === 1) return "1 day ago";
  if (days < 60) return `${days} days ago`;
  const months = Math.floor(days / 30);
  if (months < 24) return `${months} months ago`;
  return `${Math.floor(months / 12)} years ago`;
}

function renderShell() {

  root.innerHTML = SECTIONS.map(
    (sec, i) => `
    <h2>${esc(sec.title)}<button class="copy" data-section="${i}" title="Copy all ${esc(sec.title)} versions" aria-label="Copy all ${esc(sec.title)} versions">${ICON_COPY}</button></h2>
    <div class="grid">
      ${sec.sdks
        .map(
          (s) => `
        <div class="card" id="card-${s.id}">
          <div class="platform">${esc(s.platform)}</div>
          <div class="name">${esc(s.name)}</div>
          <div class="version"><span class="skeleton">loading&hellip;</span></div>
          <div class="date"></div>
          ${s.pod ? '<div class="pins pod-block" hidden></div>' : ""}
          ${s.pins ? '<div class="pins" hidden></div>' : ""}
          <div class="src">Source: <a href="${esc(s.sourceUrl)}" target="_blank" rel="noopener">${esc(s.sourceLabel)}</a></div>
        </div>`
        )
        .join("")}
    </div>`
  ).join("");
}

function renderCard(sdk) {
  const card = document.getElementById(`card-${sdk.id}`);
  const res = results[sdk.id];
  const verEl = card.querySelector(".version");
  const dateEl = card.querySelector(".date");
  if (res.error) {
    verEl.innerHTML = '<span class="chip err">unavailable</span>';
    dateEl.innerHTML = `<span class="error-msg">${esc(res.error)}</span>`;
    return;
  }
  verEl.innerHTML =
    (res.url
      ? `<a href="${esc(res.url)}" target="_blank" rel="noopener">${esc(res.version)}</a>`
      : esc(res.version)) + copyBtn(res.version);
  const ago = daysAgo(res.date);
  const released = res.date ? `Released ${fmtDate(res.date)} (${ago})` : "";
  dateEl.textContent = [released, res.note].filter(Boolean).join(" · ");
}

function pinChip(pin, latest) {
  if (!pin || !latest) return "";
  return pin === latest
    ? '<span class="chip ok">latest</span>'
    : `<span class="chip warn">latest is ${esc(latest)}</span>`;
}

// Compare the CocoaPods version against the GitHub release shown on the card.
// If they differ, flag a mismatch and name the newer version as the effective latest.
function podChip(podVer, releaseVer) {
  if (!podVer || !releaseVer) return "";
  if (podVer === releaseVer) return '<span class="chip ok">in sync</span>';
  const newest = semverCompare(podVer, releaseVer) > 0 ? podVer : releaseVer;
  return `<span class="chip warn" title="CocoaPods ${esc(podVer)} vs GitHub release ${esc(releaseVer)} — newest is ${esc(newest)}">mismatch · newest ${esc(newest)}</span>`;
}

function renderPod(sdk) {
  const card = document.getElementById(`card-${sdk.id}`);
  const el = card && card.querySelector(".pod-block");
  const res = results[sdk.id];
  if (!el || !res) return;
  el.hidden = false;
  if (res.podError) {
    el.innerHTML = `<div class="pins-title">CocoaPods</div><div class="error-msg">${esc(res.podError)}</div>`;
    return;
  }
  const podUrl = `https://cocoapods.org/pods/${encodeURIComponent(sdk.pod.name)}`;
  el.innerHTML =
    '<div class="pins-title">CocoaPods</div>' +
    `<span class="pod-name">pod '${esc(sdk.pod.name)}'</span>` +
    `<div class="pod-value"><a href="${esc(podUrl)}" target="_blank" rel="noopener">${esc(res.pod)}</a>${copyBtn(res.pod)}${podChip(res.pod, res.version)}</div>`;
}

function renderPins(sdk) {
  const card = document.getElementById(`card-${sdk.id}`);
  const el = card && card.querySelector(".pins");
  const res = results[sdk.id];
  if (!el || !res || !res.pins) return;
  el.hidden = false;
  el.innerHTML =
    '<div class="pins-title">Bundled native SDKs</div>' +
    res.pins
      .map((p) => {
        const latest = (results[p.latestFrom] || {}).version || null;
        return `<div class="pin-row"><span>${esc(p.label)}</span>
          <span class="pin-ver">${esc(p.version || p.missingText || "?")}${p.version ? copyBtn(p.version) : ""}${pinChip(p.version, latest)}</span></div>`;
      })
      .join("");
}

async function loadSdk(sdk) {
  const podPromise = sdk.pod
    ? fetchPodVersion(sdk.pod).then(
        (v) => ({ pod: v }),
        (e) => ({ podError: e.message || String(e) })
      )
    : null;
  try {
    const res = await sdk.fetcher();
    results[sdk.id] = res;
    renderCard(sdk);
    if (sdk.pins && res.version) {
      res.pins = sdk.pinsSource === "pub"
        ? await fetchPubPins(res.archiveUrl, sdk.pins)
        : await fetchPins(sdk.name, res.version, sdk.pins);
      renderPins(sdk);
    }
  } catch (e) {
    results[sdk.id] = { error: e.message || String(e) };
    renderCard(sdk);
    track("card_error", { sdk: sdk.id, message: (e.message || String(e)).slice(0, 100) });
  }
  if (podPromise) {
    Object.assign(results[sdk.id], await podPromise);
    renderPod(sdk);
    if (results[sdk.id].podError) {
      track("card_error", { sdk: `${sdk.id}-pod`, message: results[sdk.id].podError.slice(0, 100) });
    }
  }
  return sdk;
}

async function loadAll() {
  renderShell();
  document.getElementById("stamp").textContent = "";
  const all = SECTIONS.flatMap((s) => s.sdks);
  await Promise.all(all.map(loadSdk));
  all.filter((s) => s.pins).forEach(renderPins);
  document.getElementById("stamp").textContent =
    "Last checked " + new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}

loadAll();
</script>
</body>
</html>
